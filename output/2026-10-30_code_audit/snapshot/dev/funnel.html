<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>플레이 퍼널</title>
    <!-- 배포판 플레이 기록을 모아 본다 — 관리자만 읽힌다 (ADR-0633 · src/dev/README.md 「퍼널」) -->
    <style>
        :root {
            --bg: #0a0a12; --line: #303048; --text: #e8e8f0; --text2: #a0a0c0; --muted: #606080;
            --bar: #3987e5;      /* 단일 계열(크기) — dataviz 기본 팔레트 파랑의 어두운 바탕 단계 */
            --track: #1a1a26; --warn: #f8b830;
        }
        body { background: var(--bg); color: var(--text); font: 13px/1.5 Consolas, 'Malgun Gothic', monospace; padding: 16px 20px; margin: 0; }
        h1 { font-size: 22px; font-weight: normal; margin: 0 0 6px; }
        h2 { font-size: 14px; color: var(--text2); margin: 22px 0 6px; border-bottom: 1px solid var(--line); font-weight: normal; }
        button, select { font: inherit; color: var(--text); background: #16162a; border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; }
        button:hover { border-color: var(--text2); }
        label { color: var(--text2); margin-right: 14px; white-space: nowrap; }
        #auth { color: var(--text2); margin: 6px 0 10px; }
        #auth .warn { color: var(--warn); }
        #auth code { color: var(--text); background: #16162a; padding: 1px 6px; user-select: all; }
        #controls { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; margin-bottom: 8px; }
        #controls[hidden], .need-data[hidden] { display: none; }
        .tiles { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
        .tile { border: 1px solid var(--line); padding: 8px 14px; min-width: 120px; }
        .tile b { display: block; font-size: 24px; font-weight: normal; }
        .tile span { color: var(--text2); font-size: 12px; }
        .wrap { overflow-x: auto; }
        table { border-collapse: collapse; font-size: 12px; margin: 4px 0 10px; }
        td, th { border: 1px solid var(--line); padding: 3px 8px; text-align: right; white-space: nowrap; }
        th { color: var(--text2); font-weight: normal; }
        td.l, th.l { text-align: left; }
        tr.grp td { color: var(--text2); background: #10101c; text-align: left; }
        .muted { color: var(--muted); }
        /* 막대 — 두께 12px · 끝만 4px 둥글게 · 바탕선에서 자란다 · 값은 막대 옆 글자색(막대 색을 입지 않는다) */
        .barcell { display: flex; align-items: center; gap: 8px; min-width: 260px; }
        .track { flex: 0 0 200px; height: 12px; background: var(--track); }
        .bar { height: 12px; background: var(--bar); border-radius: 0 4px 4px 0; min-width: 1px; }
        .bar.zero { background: transparent; }
        @media (max-width: 640px) { body { padding: 12px 16px; } .track { flex-basis: 110px; } .barcell { min-width: 170px; } }
    </style>
</head>
<body>
    <h1>플레이 퍼널</h1>
    <div id="auth">…</div>
    <div id="controls" hidden>
        <label>첫 방문 <select id="range"><option value="all">전체</option><option value="7">최근 7일</option><option value="30">최근 30일</option></select></label>
        <label><input type="checkbox" id="hideIdle"> 원정 0분 유저 빼기</label>
        <label><input type="checkbox" id="cells"> 칸 단위</label>
        <button id="reload">새로 읽기</button>
    </div>
    <div class="need-data" hidden>
        <div class="tiles" id="tiles"></div>
        <h2>진행 퍼널 — 노말 · 도달 유저 · 걸린 원정 시간은 그 칸을 처음 깬 순간의 원정 플레이 시간 중앙값</h2>
        <div class="wrap"><table id="funnel"></table></div>
        <h2>기능 사용 — 세이브 counters 가 1 이상인 유저 (새 게임 시작한 유저 기준)</h2>
        <div class="wrap"><table id="features"></table></div>
        <h2>유저 — 마지막 접속 순</h2>
        <div class="wrap"><table id="users"></table></div>
    </div>
    <script type="module" src="./funnel.js"></script>
</body>
</html>
