<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>함성 · 게임에 적용된 충격파</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#17191d;color:#ece5d7;font:15px/1.45 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:25px;margin:0}p{color:#b4b0ab;margin:8px 0 18px}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:22px}select,button{font:inherit;background:#2b2c31;color:inherit;border:1px solid #655844;border-radius:5px;padding:8px 13px}button{cursor:pointer}label{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{background:#222429;border:1px solid #46413a;border-radius:8px;padding:16px;overflow:visible}h2{font-size:18px;margin:0}small{color:#b4a185}.stage{height:255px;display:grid;place-items:center;position:relative;overflow:visible}.portrait{width:90px;height:90px;object-fit:cover;background:#302c29;border:1px solid #7d6c57;border-radius:5px}.effect{position:absolute;left:50%;top:calc(50% + var(--offset));translate:-50% -50%;width:var(--size);height:var(--size);object-fit:contain;pointer-events:none;max-width:none}.echo1{transform:scale(.76);opacity:.32}.echo2{transform:scale(.52);opacity:.12}.playing .effect{animation:shout 1100ms cubic-bezier(.12,.6,.25,1) both;animation-delay:var(--delay)}.outline .portrait{outline:2px dashed #d7b674;outline-offset:3px}.metric{text-align:center;color:#b4b0ab;font-size:12px}footer{color:#97938d;font-size:12px;margin-top:22px}@keyframes shout{0%{transform:scale(.22);opacity:0}9%{opacity:.15}22%{opacity:.98}77%{transform:scale(1.06);opacity:.65}100%{transform:scale(1.18);opacity:0}}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:18px}.grid{grid-template-columns:1fr}}
</style><main><h1>함성 · 게임에 적용된 충격파</h1><p>6종 × 다크 카툰·금속박. 초상 90px에 충격파 206–274px를 표시합니다.</p>
<nav><select id="style" aria-label="그림체"><option value="darktoon">다크 카툰</option><option value="foil">금속박</option></select><button id="play">움직임 재생</button><label><input id="outline" type="checkbox">초상 경계 표시</label></nav><div class="grid" id="grid"></div><footer>게임 파일을 직접 읽는 적용본 미리보기 · 생성 원본·프롬프트: manifest.json</footer></main>
<script>
const sprites=/*__SPRITES__*/[];
function render(){document.body.classList.remove('playing');document.getElementById('grid').innerHTML=sprites.filter(s=>s.style===document.getElementById('style').value).map(s=>`<article><h2>${s.name}</h2><small>${s.en}</small><div class="stage"><img class="portrait" src="../../faces/source/hero/warrior_samson.png" alt="기존 전사 초상">${[0,1,2].map(k=>`<img class="effect ${k?'echo'+k:''}" src="${s.game_file?'../../fx/skills/'+s.game_file:s.output}" alt="${k?'':s.name+' 충격파'}" style="--size:${s.size}px;--offset:${s.size*.05}px;--delay:${k*s.delay}ms">`).join('')}</div><div class="metric">초상 90px · 충격파 ${s.size}px</div></article>`).join('')}
document.getElementById('style').onchange=render;
document.getElementById('play').onclick=()=>{document.body.classList.remove('playing');void document.body.offsetWidth;document.body.classList.add('playing')};
document.getElementById('outline').onchange=e=>document.body.classList.toggle('outline',e.target.checked);render();
</script></html>
