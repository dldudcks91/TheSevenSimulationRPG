<title>11-17 Gemini 이펙트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 한 줄 = 이펙트 하나: 왼쪽 이름 · 오른쪽 지금 / Gemini 판. 위에 직업 이동 줄. 맨 아래 원본 시트(키잉본). */
:root {
  --bg: #eef0f2;
  --panel: #ffffff;
  --line: #d5d9de;
  --fg: #1d2127;
  --muted: #5d6570;
  --accent: #8a5a12;
  --chip-bg: rgba(12, 14, 18, .62);
  --chip-fg: #ffffff;
  --stage: #0e0e14;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --panel: #1d2026; --line: #30353d; --fg: #e6e8eb; --muted: #9aa2ad;
    --accent: #e0b062; --chip-bg: rgba(0, 0, 0, .66); --chip-fg: #ffffff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --panel: #1d2026; --line: #30353d; --fg: #e6e8eb; --muted: #9aa2ad;
  --accent: #e0b062; --chip-bg: rgba(0, 0, 0, .66); --chip-fg: #ffffff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1480px; margin: 0 auto; }
header { padding-block: 24px 12px; display: grid; gap: 4px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; }
nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
  padding-block: 10px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
}
nav a { color: var(--fg); text-decoration: none; font-weight: 500; padding: 2px 0; }
nav a span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
nav a:hover, nav a:focus-visible { color: var(--accent); }
nav a:focus-visible, .sheet:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
section { display: grid; gap: 12px; margin-bottom: 28px; scroll-margin-top: 56px; }
h2 { margin: 0; font-size: 17px; font-weight: 700; }
h2 span { color: var(--muted); font-weight: 400; font-size: 14px; }
.row {
  display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px;
}
.who { display: grid; gap: 6px; align-content: start; min-width: 0; }
.name { font-size: 15px; font-weight: 700; line-height: 1.3; }
.meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.en { font-size: 12px; color: var(--muted); }
.takes { display: flex; flex-wrap: wrap; gap: 12px; min-width: 0; align-content: start; }
.take { display: grid; gap: 4px; justify-items: start; }
.take-label { font-size: 12px; font-weight: 500; }
.take.cur .take-label { color: var(--muted); }
.stage { display: flex; align-items: flex-end; gap: 10px; background: var(--stage); border-radius: 4px; padding: 8px; }
.stage img { display: block; }
.stage .big { width: 176px; height: 176px; }
.stage .s { width: 88px; height: 88px; }
.none { width: 176px; height: 176px; display: grid; place-items: center; color: #9aa2ad; font-size: 12px; }
.sheets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sheet-box { display: grid; gap: 4px; min-width: 0; }
.sheet-label { font-size: 12px; font-weight: 500; }
.sheet { position: relative; display: block; width: 100%; aspect-ratio: 1; padding: 0; border: 0; background: var(--stage); border-radius: 4px; overflow: hidden; cursor: zoom-in; }
.sheet img { display: block; width: 100%; height: 100%; object-fit: cover; }
.grid9 { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
.grid9 span {
  align-self: start; justify-self: start; margin: 4px; padding: 0 4px; border-radius: 3px;
  background: var(--chip-bg); color: var(--chip-fg); font-family: var(--font-mono); font-size: 11px; line-height: 18px;
}
#lb { position: fixed; inset: 0; z-index: 20; background: rgba(8, 9, 11, .92); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
#lb .frame { position: relative; max-width: 100%; background: var(--stage); }
#lb img { display: block; max-width: min(96vw, 900px); max-height: calc(100vh - 80px); width: auto; height: auto; }
#lb .grid9 span { font-size: 13px; line-height: 22px; margin: 8px; }
#lb .cap { margin-top: 8px; color: #e6e8eb; font-size: 13px; text-align: center; }
@media (max-width: 900px) {
  .row { grid-template-columns: 1fr; }
  .sheets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .sheets { grid-template-columns: 1fr; }
  .stage .big, .none { width: 120px; height: 120px; }
  .stage .s { width: 60px; height: 60px; }
}
</style>

<div class="wrap">
  <header>
    <h1>11-17 Gemini 이펙트</h1>
    <div class="sub" id="sub"></div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="lb" hidden><div class="frame"><img alt=""><div class="grid9"></div></div><div class="cap"></div></div>

<script>
const ROWS = /*ROWS*/[];
const SHEETS = /*SHEETS*/[];
const JOBS = /*JOBS*/[];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const stage = src => src
  ? `<div class="stage"><img class="big" src="${src}" alt=""><img class="s" src="${src}" alt=""></div>`
  : `<div class="stage"><div class="none">그림 없음</div></div>`;

const nTakes = ROWS.reduce((n, r) => n + r.takes.length, 0);
document.getElementById("sub").textContent =
  `일반 스킬 이펙트 ${ROWS.length}칸 · Gemini 판 ${nTakes}칸 · 시트 ${SHEETS.length}장 — 관전 바탕 위 176px · 88px (관전 초상 약 90px)`;
const jobs = JOBS.filter(([k]) => ROWS.some(r => r.job === k));
document.getElementById("nav").innerHTML =
  jobs.map(([k, t]) => `<a href="#${k}">${t} <span>${ROWS.filter(r => r.job === k).length}</span></a>`).join("") +
  `<a href="#sheets">원본 시트 <span>${SHEETS.length}</span></a>`;

const main = document.getElementById("main");
main.innerHTML = jobs.map(([k, t]) => {
  const rows = ROWS.filter(r => r.job === k);
  return `<section id="${k}"><h2>${t} <span>${rows.length}칸</span></h2>` + rows.map(r => `
    <article class="row" id="${r.id}">
      <div class="who">
        <div class="name">${esc(r.kr)}</div>
        <div class="en">${esc(r.en)}</div>
        <div class="meta">${esc(r.file)}</div>
      </div>
      <div class="takes">
        <div class="take cur"><div class="take-label">지금</div>${stage(r.cur)}</div>
        ${r.takes.map(x => `<div class="take"><div class="take-label">${esc(x.label)}</div>${stage(x.src)}</div>`).join("")}
      </div>
    </article>`).join("") + "</section>";
}).join("") + `<section id="sheets"><h2>원본 시트 <span>${SHEETS.length}장 · 마젠타를 걷은 키잉본</span></h2><div class="sheets">` +
  SHEETS.map((s, i) => `<div class="sheet-box"><div class="sheet-label">${esc(s.tag)}</div>
    <button class="sheet" type="button" data-i="${i}"><img src="${s.src}" alt="${esc(s.tag)}" loading="lazy">
    <div class="grid9">${s.ids.map((id, k) => `<span>${k + 1}</span>`).join("")}</div></button></div>`).join("") + "</div></section>";

const lb = document.getElementById("lb");
const lbImg = lb.querySelector("img"), lbGrid = lb.querySelector(".grid9"), lbCap = lb.querySelector(".cap");
let open = -1;
function show(i) {
  const s = SHEETS[i]; if (!s) return;
  open = i; lbImg.src = s.src; lbImg.alt = s.tag;
  lbGrid.innerHTML = s.ids.map((id, k) => `<span>${k + 1} ${esc(id.replace("@", " "))}</span>`).join("");
  lbCap.textContent = `${s.tag}  (← → 로 넘기기 · Esc 닫기)`;
  lb.hidden = false;
}
function close() { lb.hidden = true; open = -1; }
main.addEventListener("click", ev => { const b = ev.target.closest(".sheet"); if (b) show(+b.dataset.i); });
lb.addEventListener("click", close);
document.addEventListener("keydown", ev => {
  if (open < 0) return;
  if (ev.key === "Escape") close();
  else if (ev.key === "ArrowRight") show(Math.min(open + 1, SHEETS.length - 1));
  else if (ev.key === "ArrowLeft") show(Math.max(open - 1, 0));
});
</script>
