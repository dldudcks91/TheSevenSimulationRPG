<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상단 의뢰 목업</title>
<style>
:root{
  --bg:#111316; --panel:#1b1e23; --line:#3a3f47; --txt:#ece5d8; --dim:#9b958b;
  --ring:#c4432e; --gold:#e3ad3c; --enemy:#b0402f; --ally:#c9a35a; --ok:#6fbf5a; --low:#d0503c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
#stage{width:1600px;height:800px;margin:0 auto;position:relative;overflow:hidden}
#bar{height:60px;display:flex;align-items:center;gap:8px;padding:0 32px;font-size:14px;color:var(--dim)}
#bar b{color:var(--txt);font-size:15px;margin-right:10px}
#bar button{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font:inherit;cursor:pointer;min-width:64px}
#bar button:hover{border-color:var(--gold)}
#bar .note{margin-left:auto}
#map{position:absolute;left:32px;top:64px;width:1536px;height:714px;overflow:hidden;border:1px solid var(--line);background:#0b0d10}
#layer{position:absolute;left:0;top:0;width:1536px;height:714px;transform-origin:0 0}
#layer img{width:1536px;height:714px;display:block}
#layer svg{position:absolute;left:0;top:0;width:1536px;height:714px;overflow:visible}
#ov{position:absolute;inset:0;pointer-events:none}

.wagon{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:3px solid var(--ring);
  box-shadow:0 0 0 2px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.65);background:#e6d7b5;overflow:hidden;z-index:3}
.wagon .f{width:100%;height:100%}
.wagon.flip .f{transform:scaleX(-1)}
.wagon img{width:100%;height:100%;display:block}
.wagon.moving img{animation:bob .42s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.wagon.shake img{animation:shake .11s linear infinite}
@keyframes shake{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:translateX(-3px)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:1;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(170,30,20,.6) 100%)}

.amb{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#3a1512;border:2px solid var(--enemy);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.65);z-index:2}
.amb svg{width:22px;height:22px;grid-area:1/1}
.amb .chk{display:none}
.amb.next{animation:pulse 1s ease-in-out infinite}
.amb.done{background:#26282c;border-color:#6b6f76}
.amb.done .sw{opacity:.3}
.amb.done .chk{display:block}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(208,80,60,.7),0 2px 6px rgba(0,0,0,.65)}50%{box-shadow:0 0 0 8px rgba(208,80,60,0),0 2px 6px rgba(0,0,0,.65)}}
.goal{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#2c2412;border:2px solid var(--gold);
  display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.65);z-index:2}
.goal svg{width:20px;height:20px}
.bubble{position:absolute;transform:translate(-50%,-100%);margin-top:-40px;background:var(--low);color:#fff;font-weight:700;font-size:16px;
  padding:4px 10px;border-radius:4px;box-shadow:0 3px 8px rgba(0,0,0,.6);z-index:4;white-space:nowrap}

.spot{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;padding:4px;z-index:1;opacity:.75;
  box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.spot img{width:100%;height:100%;border-radius:50%;display:block;filter:grayscale(.6) brightness(.7)}
.sz{transform-origin:50% 50%}
#card{position:absolute;right:16px;top:16px;background:rgba(18,20,24,.93);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:250px;z-index:5}
#card .title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
#card .title img{width:30px;height:30px;border-radius:50%;border:2px solid var(--ring)}
#card .row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--dim)}
#card .row .v{color:var(--txt);font-variant-numeric:tabular-nums;margin-left:auto}
#card .faces{display:flex;gap:4px;margin-left:auto}
#card .faces img{width:36px;height:36px;border-radius:3px;border:1px solid var(--line);object-fit:cover;display:block}
#card .pips{display:flex;gap:6px;margin-left:auto}
#card .pip{width:24px;height:24px;border-radius:50%;background:#3a1512;border:2px solid var(--enemy);display:grid;place-items:center}
#card .pip svg{width:14px;height:14px}
#card .pip.done{background:#26282c;border-color:#6b6f76}
#card .pip.done svg{opacity:.3}

#battle{position:absolute;inset:0;opacity:0;z-index:6;pointer-events:none}
#battle .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42) saturate(.8)}
#battle .lbl{position:absolute;left:20px;top:16px;background:rgba(18,20,24,.9);border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-weight:700}
#battle .side{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:32px}
#battle .side.enemy{top:64px}
#battle .side.ally{bottom:60px}
.unit{width:136px}
.unit .pf{width:136px;height:136px;border:3px solid;border-radius:4px;overflow:hidden;background:#000;transition:transform .08s}
.unit .pf img{width:100%;height:100%;object-fit:cover;display:block}
.enemy .unit .pf{border-color:var(--enemy)}
.ally .unit .pf{border-color:var(--ally)}
.unit .hp{height:10px;background:#2a1a18;margin-top:6px;border-radius:2px;overflow:hidden;border:1px solid #000}
.unit .hp i{display:block;height:100%;background:var(--ok)}
.unit .hp i.low{background:var(--low)}
.unit.down .pf{filter:grayscale(1) brightness(.45)}
.unit.hit .pf{transform:translateY(-4px) scale(1.03)}
#battle .win{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:800;color:var(--gold);
  text-shadow:0 3px 10px rgba(0,0,0,.9);letter-spacing:4px;display:none}
#battle .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;color:var(--dim);letter-spacing:6px}

#result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(18,20,24,.96);border:1px solid var(--gold);border-radius:8px;
  padding:20px 26px;min-width:340px;display:none;z-index:7;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.7)}
#result h2{margin:0 0 14px;font-size:22px;color:var(--gold);display:flex;align-items:center;gap:10px}
#result h2 img{width:36px;height:36px;border-radius:50%;border:2px solid var(--ring)}
#result .r{display:flex;align-items:center;gap:12px;margin-top:12px;color:var(--dim)}
#result .r .v{margin-left:auto;color:var(--txt)}
#result .r img{width:96px;height:96px;border:3px solid var(--gold);border-radius:4px;object-fit:cover;margin-left:auto}
#result button{margin-top:18px;width:100%;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:8px;font:inherit;cursor:pointer}
#result button:hover{border-color:var(--gold)}
</style>
</head>
<body>
<div id="stage">
  <div id="bar">
    <b>상단 의뢰 목업</b>
    <button id="bRestart">처음부터</button>
    <button id="bPlay">일시정지</button>
    <button id="bSpeed">×1</button>
    <button id="bZoom">전체 지도</button>
    <span class="note">목업 — 게임 코드와 무관 · 10분 판을 약 47초로 줄여 보여 준다</span>
  </div>
  <div id="map">
    <div id="layer">
      <img src="../../src/assets/art/backgrounds/explore_world_muted.webp" alt="">
      <svg viewBox="0 0 1536 714">
        <polyline id="routeAll" fill="none" stroke="rgba(255,240,210,.55)" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <polyline id="routeDone" fill="none" stroke="rgba(227,173,60,.95)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>
    <div id="flash"></div>
    <div id="ov"></div>
    <div id="card"></div>
    <div id="battle">
      <img class="bg" src="../../src/assets/art/backgrounds/illustrate/background_stage_101.webp" alt="">
      <div class="lbl" id="bLbl"></div>
      <div class="side enemy" id="sEnemy"></div>
      <div class="vs">VS</div>
      <div class="side ally" id="sAlly"></div>
      <div class="win" id="bWin">승리</div>
    </div>
    <div id="result"></div>
  </div>
</div>
<script>
const ART = '../../src/assets/art/';
const FACE = n => ART + 'faces/gemini/hero/' + n + '.webp';
const CARAVAN = ART + 'icons/explore/caravan.webp';
const MAP_W = 1536, MAP_H = 714;

// 1장 길 — 마을 문 → 숲으로 넘어가는 다리 (지도 그림 원본 좌표)
// 1장 상단 지점(그림 속 마차 자리) → 숲으로 넘어가는 다리 (지도 그림 원본 좌표)
const SPOT = [173.6, 412.7];
const ROUTE = [SPOT,[160,430],[150,432],[137,422],[120,412],[108,398],[102,382],
  [100,365],[107,353],[120,345],[135,338],[138,325],[132,308],[120,295],[110,278],[103,255],[97,236]];
// 습격 자리 — 출발 때 정해 두고 화면에는 숨긴다(덮친 뒤에만 흔적이 남는다)
const AMB = [0.24, 0.55, 0.84];
const PARTY = ['knight_1','priest_2','archer_3'];
const WAVES = [
  { foes:['warrior_2','archer_1','mage_1'],  die:[.55,.8,1], loss:[.25,.08,.32] },
  { foes:['knight_4','mage_3','archer_4'],   die:[.6,.85,1], loss:[.4,.15,.3] },
  { foes:['warrior_5','knight_7','priest_4'],die:[.7,.9,1],  loss:[.58,.32,.62] },
];
const JOINER = 'warrior_5';
const GAME_SEC = 600;

const SW = '<svg class="sw" viewBox="0 0 24 24" fill="none" stroke="#f1d9c8" stroke-width="2" stroke-linecap="round"><path d="M4 4L14 14M11 17L17 11M15.5 15.5L19 19M20 4L10 14M7 11L13 17M8.5 15.5L5 19"/></svg>';
const CHK = '<svg class="chk" viewBox="0 0 24 24" fill="none" stroke="#9fd38f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>';
const FLAG = '<svg viewBox="0 0 24 24" fill="none" stroke="#e3ad3c" stroke-width="2" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h11l-3 4 3 4H6" fill="rgba(227,173,60,.35)"/></svg>';

// 경로 길이
const CUM = [0];
for (let i = 1; i < ROUTE.length; i++) {
  const [x0,y0] = ROUTE[i-1], [x1,y1] = ROUTE[i];
  CUM.push(CUM[i-1] + Math.hypot(x1-x0, y1-y0));
}
const LEN = CUM[CUM.length-1];
function at(f) {
  const d = Math.max(0, Math.min(1, f)) * LEN;
  let i = 1; while (i < CUM.length - 1 && CUM[i] < d) i++;
  const k = (d - CUM[i-1]) / (CUM[i] - CUM[i-1] || 1);
  const [x0,y0] = ROUTE[i-1], [x1,y1] = ROUTE[i];
  return { x: x0 + (x1-x0)*k, y: y0 + (y1-y0)*k, i };
}
function pathTo(f) {
  const p = at(f), pts = ROUTE.slice(0, p.i).map(q => q.join(','));
  pts.push(p.x + ',' + p.y);
  return pts.join(' ');
}

// 시간표
const PH = []; let T = 0;
const push = p => { p.t0 = T; T += p.dur; PH.push(p); };
push({ k:'travel', a:0, b:AMB[0], dur:6 });
const LEG = [7.8, 7.2, 4];
for (let w = 0; w < 3; w++) {
  push({ k:'alert', w, dur:0.9 });
  push({ k:'battle', w, dur: w === 2 ? 6 : 5 });
  push({ k:'win', w, dur:1.1 });
  push({ k:'travel', a:AMB[w], b: w < 2 ? AMB[w+1] : 1, dur: LEG[w] });
}
const TOTAL = T;
push({ k:'result', dur: 1e9 });

const q = new URLSearchParams(location.search);
let t = q.has('t') ? parseFloat(q.get('t')) : 0;
let playing = !q.has('t');
let speed = 1;
let zoomOn = q.get('zoom') !== '0';
const view = { z: 1, ox: 0, oy: 0 };
function viewTarget() {
  if (!zoomOn) return { z: 1, ox: 0, oy: 0 };
  const z = 2, cx = 135, cy = 334;
  const vw = MAP_W / z, vh = MAP_H / z;
  return { z, ox: Math.max(0, Math.min(MAP_W - vw, cx - vw/2)), oy: Math.max(0, Math.min(MAP_H - vh, cy - vh/2)) };
}
Object.assign(view, viewTarget());

// DOM
const ov = document.getElementById('ov');
ov.innerHTML = `<div class="spot sz" id="spot"><img src="${CARAVAN}" alt=""></div>`
  + AMB.map((_, i) => `<div class="amb sz" id="amb${i}">${SW}${CHK}</div>`).join('')
  + `<div class="goal sz" id="goal">${FLAG}</div>`
  + `<div class="wagon sz" id="wagon"><div class="f"><img src="${CARAVAN}" alt=""></div></div>`
  + `<div class="bubble" id="bubble" style="display:none">습격!</div>`;
document.getElementById('routeAll').setAttribute('points', ROUTE.map(p => p.join(',')).join(' '));
const unitHTML = n => `<div class="unit"><div class="pf"><img src="${FACE(n)}" alt=""></div><div class="hp"><i></i></div></div>`;
document.getElementById('sAlly').innerHTML = PARTY.map(unitHTML).join('');

function phaseAt(tt) { let p = PH[0]; for (const x of PH) if (tt >= x.t0) p = x; return p; }
const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0'); };
const scr = (x, y) => [(x - view.ox) * view.z, (y - view.oy) * view.z];
const place = (el, x, y) => { const [sx, sy] = scr(x, y); el.style.left = sx + 'px'; el.style.top = sy + 'px'; };

let shownWave = -1;
function render() {
  const p = phaseAt(t), lp = Math.min(1, (t - p.t0) / p.dur);
  // 위치
  let f;
  if (p.k === 'travel') f = p.a + (p.b - p.a) * lp;   // 같은 속도로 가다가 그 자리에서 멈춘다 — 미리 느려지지 않는다
  else if (p.k === 'result') f = 1;
  else f = AMB[p.w];
  const pos = at(f), ahead = at(Math.min(1, f + 0.01));
  const cleared = PH.filter(x => x.k === 'win' && t >= x.t0 + x.dur * 0.2).length;

  document.getElementById('layer').style.transform = `scale(${view.z}) translate(${-view.ox}px, ${-view.oy}px)`;
  document.getElementById('routeDone').setAttribute('points', pathTo(f));
  const wg = document.getElementById('wagon');
  place(wg, pos.x, pos.y);
  wg.classList.toggle('moving', p.k === 'travel' && playing);
  wg.classList.toggle('flip', ahead.x - pos.x > 0.3);
  wg.classList.toggle('shake', p.k === 'alert');
  const fighting = p.w !== undefined && p.k !== 'travel';
  AMB.forEach((a, i) => {
    const el = document.getElementById('amb' + i), ap = at(a);
    place(el, ap.x, ap.y);
    const now = fighting && p.w === i && i >= cleared;
    el.style.display = (i < cleared || now) ? '' : 'none';
    el.classList.toggle('done', i < cleared);
    el.classList.toggle('next', now);
  });
  const fl = document.getElementById('flash');
  fl.style.opacity = p.k === 'alert' ? (lp < 0.25 ? lp / 0.25 : 1 - (lp - 0.25) / 0.75 * 0.6) : 0;
  const g = at(1); place(document.getElementById('goal'), g.x, g.y);
  // 지점 아이콘은 제자리 — 테두리가 진행 막대(지금 탐험 탭 규격과 같다)
  const sp = document.getElementById('spot');
  place(sp, SPOT[0], SPOT[1]);
  const prog = Math.min(t, TOTAL) / TOTAL * 100;
  sp.style.background = `conic-gradient(var(--ring) ${prog}%, #2a201d 0)`;
  // 확대를 풀면 표지도 작아진다
  const s = 0.6 + 0.4 * (view.z - 1);
  document.querySelectorAll('#ov .sz').forEach(el => { el.style.transform = `scale(${s})`; });
  const bub = document.getElementById('bubble');
  bub.style.display = p.k === 'alert' ? '' : 'none';
  if (p.k === 'alert') place(bub, pos.x, pos.y);

  // 정보 카드
  const remain = GAME_SEC * (1 - Math.min(t, TOTAL) / TOTAL);
  document.getElementById('card').innerHTML =
    `<div class="title"><img src="${CARAVAN}" alt="">상단 의뢰</div>`
    + `<div class="row">Party I<span class="faces">${PARTY.map(n => `<img src="${FACE(n)}" alt="">`).join('')}</span></div>`
    + `<div class="row">습격<span class="pips">${AMB.map((_, i) => `<span class="pip${i < cleared ? ' done' : ''}">${SW}</span>`).join('')}</span></div>`
    + `<div class="row">${p.k === 'result' ? '완료' : '남은 시간'}<span class="v">${p.k === 'result' ? '' : mmss(remain)}</span></div>`;

  // 전투
  const bt = document.getElementById('battle');
  let op = 0;
  if (p.k === 'alert') op = Math.max(0, (lp - 0.6) / 0.4);
  else if (p.k === 'battle') op = 1;
  else if (p.k === 'win') op = lp < 0.7 ? 1 : 1 - (lp - 0.7) / 0.3;
  bt.style.opacity = op;
  if (p.w !== undefined && p.k !== 'travel') {
    const W = WAVES[p.w];
    if (shownWave !== p.w) {
      document.getElementById('sEnemy').innerHTML = W.foes.map(unitHTML).join('');
      shownWave = p.w;
    }
    document.getElementById('bLbl').textContent = `습격 ${p.w + 1} / 3`;
    const bp = p.k === 'battle' ? lp : (p.k === 'win' ? 1 : 0);
    const hitIx = Math.floor(bp * 18), frac = bp * 18 - hitIx;
    const eu = document.querySelectorAll('#sEnemy .unit'), au = document.querySelectorAll('#sAlly .unit');
    eu.forEach((u, i) => {
      const hp = Math.max(0, 1 - (Math.floor(bp * 14) / 14) / W.die[i]);
      const bar = u.querySelector('.hp i');
      bar.style.width = (hp * 100) + '%'; bar.classList.toggle('low', hp < .35);
      u.classList.toggle('down', hp <= 0);
      u.classList.toggle('hit', p.k === 'battle' && hp > 0 && hitIx % 2 === 0 && (hitIx >> 1) % 3 === i && frac < .4);
    });
    au.forEach((u, i) => {
      const hp = 1 - W.loss[i] * (Math.floor(bp * 11) / 11);
      const bar = u.querySelector('.hp i');
      bar.style.width = (hp * 100) + '%'; bar.classList.toggle('low', hp < .35);
      u.classList.toggle('hit', p.k === 'battle' && hitIx % 2 === 1 && (hitIx >> 1) % 3 === i && frac < .4);
    });
    document.getElementById('bWin').style.display = p.k === 'win' ? 'block' : 'none';
  } else {
    au_reset();
  }

  // 결과
  const rs = document.getElementById('result');
  if (p.k === 'result') {
    if (rs.style.display !== 'block') {
      rs.innerHTML = `<h2><img src="${CARAVAN}" alt="">의뢰 완료</h2>`
        + `<div class="r">습격<span class="v">3 / 3 격퇴</span></div>`
        + `<div class="r">감사인사<span class="v">(미정)</span></div>`
        + `<div class="r">가입 희망<img src="${FACE(JOINER)}" alt=""></div>`
        + `<button id="bAgain">다시 보기</button>`;
      document.getElementById('bAgain').onclick = restart;
    }
    rs.style.display = 'block';
  } else rs.style.display = 'none';
}
function au_reset() {
  document.querySelectorAll('#sAlly .unit').forEach(u => { u.classList.remove('hit'); u.querySelector('.hp i').style.width = '100%'; });
}

function restart() { t = 0; playing = true; document.getElementById('bPlay').textContent = '일시정지'; }
document.getElementById('bRestart').onclick = restart;
document.getElementById('bPlay').onclick = () => { playing = !playing; document.getElementById('bPlay').textContent = playing ? '일시정지' : '재생'; };
document.getElementById('bSpeed').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 4 : 1; document.getElementById('bSpeed').textContent = '×' + speed; };
document.getElementById('bZoom').onclick = () => { zoomOn = !zoomOn; document.getElementById('bZoom').textContent = zoomOn ? '전체 지도' : '확대'; };
document.getElementById('bZoom').textContent = zoomOn ? '전체 지도' : '확대';
if (!playing) document.getElementById('bPlay').textContent = '재생';

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && t < TOTAL + 0.5) t += dt * speed;
  const tg = viewTarget(), k = Math.min(1, dt * 6);
  view.z += (tg.z - view.z) * k; view.ox += (tg.ox - view.ox) * k; view.oy += (tg.oy - view.oy) * k;
  render();
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);
</script>
</body>
