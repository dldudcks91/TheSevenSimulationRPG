_warcry_foil.webp"}, {"id": "war_battlecry", "name": "배틀 크라이", "en": "Battle Cry", "event": "bad", "palette": "dusty ochre-gold faces with iron-gray outer facets, dark umber shadows and pale sand highlights", "subject": "THREE pairs of broad broken angular open sound arcs to the LEFT and RIGHT of an empty center. Each arc has ONE clean transparent diagonal split through its width, as if the forceful voice cracks the air like armor. The inner pair shortest, middle pair medium, outer pair longest. The split separates large sound-wave segments only: do NOT add literal armor plates or stones.", "style": "darktoon", "source": "war_battlecry_darktoon.png", "output": "exports/war_battlecry_darktoon.webp", "game_target": "src/assets/art/fx/skills/war_battlecry_darktoon.webp"}, {"id": "war_battlecry", "name": "배틀 크라이", "en": "Battle Cry", "event": "bad", "palette": "dusty ochre-gold faces with iron-gray outer facets, dark umber shadows and pale sand highlights", "subject": "THREE pairs of broad broken angular open sound arcs to the LEFT and RIGHT of an empty center. Each arc has ONE clean transparent diagonal split through its width, as if the forceful voice cracks the air like armor. The inner pair shortest, middle pair medium, outer pair longest. The split separates large sound-wave segments only: do NOT add literal armor plates or stones.", "style": "foil", "source": "war_battlecry_foil.png", "output": "exports/war_battlecry_foil.webp", "game_target": "src/assets/art/fx/skills/war_battlecry_foil.webp"}, {"id": "war_command", "name": "호령", "en": "Command", "event": "buff", "palette": "rich old-gold faces, muted amber shadows, warm bone-ivory highlights, very small ember-orange tips", "subject": "THREE pairs of tall forceful open sound arcs to the LEFT and RIGHT of an empty center. Their upper ends sweep up into a single broad raised point, creating an uplifted commanding silhouette while staying clearly SOUND WAVES, not stacked arrows or chevrons. Inner pair shortest, middle pair medium, outer pair longest. This advanced shout has heavier strokes and a stronger upward flare.", "style": "darktoon", "source": "war_command_darktoon.png", "output": "exports/war_command_darktoon.webp", "game_target": "src/assets/art/fx/skills/war_command_darktoon.webp"}, {"id": "war_command", "name": "호령", "en": "Command", "event": "buff", "palette": "rich old-gold faces, muted amber shadows, warm bone-ivory highlights, very small ember-orange tips", "subject": "THREE pairs of tall forceful open sound arcs to the LEFT and RIGHT of an empty center. Their upper ends sweep up into a single broad raised point, creating an uplifted commanding silhouette while staying clearly SOUND WAVES, not stacked arrows or chevrons. Inner pair shortest, middle pair medium, outer pair longest. This advanced shout has heavier strokes and a stronger upward flare.", "style": "foil", "source": "war_command_foil.png", "output": "exports/war_command_foil.webp", "game_target": "src/assets/art/fx/skills/war_command_foil.webp"}, {"id": "war_intimidate", "name": "사자후", "en": "Lion's Roar", "event": "bad", "palette": "deep crimson and ember-red faces, charcoal-burgundy shadows, bone-white narrow highlight facets", "subject": "THREE pairs of huge serrated open sound arcs to the LEFT and RIGHT of an empty center. Each arc has TWO broad mane-like spikes along its OUTER edge to suggest a lion's ferocious roaring voice without drawing a lion. Inner pair shortest, middle pair medium, outer pair longest. Strongest and widest shout in the family, with sharp broad ends; no literal animal, teeth, face, eyes or head.", "style": "darktoon", "source": "war_intimidate_darktoon.png", "output": "exports/war_intimidate_darktoon.webp", "game_target": "src/assets/art/fx/skills/war_intimidate_darktoon.webp"}, {"id": "war_intimidate", "name": "사자후", "en": "Lion's Roar", "event": "bad", "palette": "deep crimson and ember-red faces, charcoal-burgundy shadows, bone-white narrow highlight facets", "subject": "  }).join('');
