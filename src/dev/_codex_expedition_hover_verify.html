<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <base href="../">
    <title>RUNNING</title>
    <link rel="stylesheet" href="./ui/style.css">
    <script type="importmap">
    {"imports":{"./ui/cloud.js":"./dev/_codex_hover_cloud_stub.js"}}
    </script>
</head>
<body>
    <div id="stage">
        <div id="app">
            <div class="brand">THE <b>SEVEN</b></div>
            <div class="topbar"><div class="crumb"></div><div class="tab-seg"></div><div class="resources"></div><div id="toast" class="toast-layer"></div></div>
            <nav class="nav"></nav><main class="main"></main>
        </div>
        <div id="tooltip" class="tooltip"></div>
        <div id="modal" class="modal-layer" hidden></div>
    </div>
    <pre id="verify" style="position:fixed;left:0;bottom:0;z-index:100"></pre>
    <script type="module">
    import './ui/app.js';
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    const round = n => Math.round(n * 100) / 100;
    try {
        let hero;
        for (let i = 0; i < 100 && !hero; i++) { await wait(100); hero = document.querySelector('#modal .hs-card[data-tip]'); }
        if (!hero?.onmouseenter) throw new Error('Expedition hero hover target missing');
        const hr = hero.getBoundingClientRect();
        hero.onmouseenter(new MouseEvent('mouseenter', { clientX: hr.right - 2, clientY: hr.top + 2 }));
        await wait(100);
        const main = document.querySelector('#tooltip');
        const baseCard = main.querySelector('.tip-card.unit.equipment');
        const baseRect = baseCard.getBoundingClientRect();
        const baseCol = baseCard.querySelector('.tip-unit-col.base').getBoundingClientRect();

        dispatchEvent(new KeyboardEvent('keydown', { key: 'Alt' }));
        await wait(100);
        const altCard = main.querySelector('.tip-card.unit.equipment.alt');
        const grid = altCard.querySelector('.tip-unit');
        const cols = [...altCard.querySelectorAll('.tip-unit-col')].map(n => n.getBoundingClientRect());
        const altRect = altCard.getBoundingClientRect();
        const tracks = getComputedStyle(grid).gridTemplateColumns;
        hero.onmouseleave(new MouseEvent('mouseleave', { relatedTarget: document.body }));

        const cell = main.querySelector('.tip-equipment .pd-cell.filled.tip-optionable');
        if (!cell?.onmouseenter) throw new Error('equipped cell hover binding missing');
        cell.onmouseenter(new MouseEvent('mouseenter'));
        await wait(100);
        const itemTip = document.querySelector('#equipment-item-tooltip');
        const shown = itemTip?.classList.contains('show');
        const hasItemName = !!itemTip?.querySelector('.tip-name');
        const hasOptions = !!itemTip?.querySelector('.tip-base, ul > li');
        const itemHead = itemTip?.querySelector('.tip-head')?.textContent.trim() ?? '';
        cell.onmouseleave(new MouseEvent('mouseleave', { relatedTarget: document.body }));
        const leftClosed = !itemTip.classList.contains('show');
        cell.onmouseenter(new MouseEvent('mouseenter'));
        dispatchEvent(new KeyboardEvent('keyup', { key: 'Alt' }));
        await wait(100);

        const result = {
            gridTracks: tracks,
            baseColumnWidth: round(baseCol.width),
            altColumnWidths: cols.map(r => round(r.width)),
            baseHeight: round(baseRect.height),
            altHeight: round(altRect.height),
            heroHeldOutside: main.classList.contains('show') === false,
            itemShown: shown,
            itemHead,
            hasItemName,
            hasOptions,
            closesOnCellLeave: leftClosed,
            closesOnAltUp: !itemTip.classList.contains('show'),
        };
        const widths = cols.map(r => r.width);
        const ratioOk = Math.abs(widths[0] / widths[1] - 200 / 220) < .002 && Math.abs(widths[1] - widths[2]) < .1;
        const heightOk = Math.abs(baseRect.height - altRect.height) < .1;
        const ok = tracks === '200px 220px 220px' && ratioOk && heightOk && shown && hasItemName && hasOptions && leftClosed && !itemTip.classList.contains('show');
        document.title = ok ? 'PASS expedition hover' : 'FAIL expedition hover';
        document.querySelector('#verify').textContent = JSON.stringify(result);
    } catch (error) {
        document.title = 'FAIL expedition hover';
        document.querySelector('#verify').textContent = error.stack || String(error);
    }
    </script>
</body>
</html>
